<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이채원 ON AIR · Shorts</title>
<style>
/*FONTS*/
:root{--pink:#FE8AAD;--pink2:#E9587F;--pinkhi:#FFD0DE;--navy:#34497A;--tally:#FF2D4B;--butter:#FFE7A1;--ink:#121A2E;--dev:#0B1020;--ok:#27D17C;
  --f:"Pretendard Variable",Pretendard,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:var(--f);color:#fff;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:break-word}
#screen{position:absolute;inset:0;transform-origin:540px 960px}
#scenes{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow:hidden;display:none;transform-origin:0 0}
.layer{position:absolute;inset:0;overflow:hidden;transform-origin:0 0}
.abs{position:absolute}
.mono{font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.ch{display:inline-block;overflow:hidden;vertical-align:top;padding:.1em .02em;margin:-.1em -.02em}
.ci{display:inline-block}
.dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:currentColor;flex:none}
svg{display:block;width:100%;height:100%}

/* ── 0 · bars + slate ── */
#barRows{inset:0;display:grid;grid-template-rows:67fr 8fr 25fr}
#barRows .row{display:flex}
#barRows i{display:block;height:100%}
#sync{left:0;right:0;top:0;height:170px;background:linear-gradient(transparent,rgba(0,0,0,.3) 45%,rgba(255,255,255,.1) 60%,transparent)}
#slate{left:96px;right:96px;top:560px;filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
#slate .stick,#slate .base{height:74px;background:repeating-linear-gradient(-58deg,#0E1220 0 46px,#F4F4F4 46px 92px);border:4px solid #0E1220}
#slate .stick{border-radius:10px 10px 0 0;transform-origin:0 100%}
#slate .base{border-radius:0}
#slate .board{background:#0E1220;border:4px solid #0E1220;border-top:0;border-radius:0 0 14px 14px;padding:34px 44px 40px;display:grid;gap:22px}
#slate .r{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding-bottom:16px;border-bottom:2px solid rgba(255,255,255,.14)}
#slate .r:last-child{border:0;padding:0}
#slate .r span{font-size:24px;color:rgba(255,255,255,.5)}
#slate .r b{font-size:44px;font-weight:800;letter-spacing:-.01em}
#slate .r b.y{color:var(--butter)}

/* ── 0b · leader ── */
#leader{background:radial-gradient(circle at 50% 50%,#5C5C5C 0,#2C2C2C 56%,#0F0F0F 100%)}
#ring{left:110px;top:530px;width:860px;height:860px}
#sweep{position:absolute;inset:0;border-radius:50%}
#ring .r1{position:absolute;inset:0;border-radius:50%;border:14px solid #EDEDED}
#ring .r2{position:absolute;inset:12%;border-radius:50%;border:5px solid rgba(255,255,255,.55)}
#ring .hx,#ring .vx{position:absolute;background:rgba(255,255,255,.5)}
#ring .hx{left:-14%;right:-14%;top:50%;height:5px;margin-top:-2.5px}
#ring .vx{top:-14%;bottom:-14%;left:50%;width:5px;margin-left:-2.5px}
#num{position:absolute;inset:0;display:grid;place-items:center;font-size:600px;font-weight:900;line-height:1;color:#F4F4F4;text-shadow:0 0 50px rgba(0,0,0,.4);padding-bottom:30px}
#dust{left:0;top:0;width:1080px;height:1920px}
#leader .lbl{left:0;right:0;top:1460px;text-align:center;font-size:30px;color:rgba(255,255,255,.6)}

/* ── 1 · on air slam ── */
#slam{background:var(--tally)}
#rays{left:-460px;top:-360px;width:2000px;height:2000px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.17) 0deg 4deg,transparent 4deg 12deg);-webkit-mask:radial-gradient(circle,transparent 0 9%,#000 26%,transparent 68%);mask:radial-gradient(circle,transparent 0 9%,#000 26%,transparent 68%)}
.wave{left:340px;top:440px;width:400px;height:400px;border-radius:50%;border:10px solid rgba(255,255,255,.9)}
#lamp{left:465px;top:565px;width:150px;height:150px;border-radius:50%;background:#fff;box-shadow:0 0 60px 20px rgba(255,255,255,.8),0 0 240px 100px rgba(255,214,224,.5)}
#slamWord{left:0;right:0;top:810px;text-align:center;font-size:262px;font-weight:900;letter-spacing:-.045em;line-height:1;white-space:nowrap}
#slamSub{left:0;right:0;top:1110px;text-align:center;font-size:46px}

/* ── 2 · hero ── */
#hero{background:var(--pink)}
#heroCam{position:absolute;inset:0;transform-origin:781px 720px}
#heroBg{position:absolute;inset:0;background:radial-gradient(70% 45% at 78% 20%,var(--pinkhi),transparent 70%),radial-gradient(90% 60% at 0% 100%,var(--pink2),transparent 62%),var(--pink)}
#glow{left:-260px;top:-240px;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(255,240,246,.62),rgba(255,240,246,0) 62%)}
#beam{left:0;top:-500px;width:300px;height:3000px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)}
#word{left:0;right:0;top:280px;display:grid;justify-items:center;font-size:360px;line-height:.84;letter-spacing:-.06em;color:var(--navy);font-weight:900}
#word .ln{width:max-content}
#figWrap{left:582px;top:480px;width:458px;height:1500px;transform-origin:50% 100%}
#fig{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(-30px 24px 36px rgba(150,28,72,.3))}
#heroGfx{position:absolute;inset:0}
#kicker{left:56px;top:974px;padding:14px 22px;border-radius:999px;background:#fff;color:var(--navy);font-size:24px;display:flex;align-items:center;gap:12px;white-space:nowrap;box-shadow:0 14px 30px rgba(52,73,122,.2)}
#kicker .dot{color:var(--tally);font-size:24px}
#name{left:44px;top:1030px;font-size:204px;font-weight:900;line-height:1.05;color:#fff;-webkit-text-stroke:16px var(--navy);paint-order:stroke fill;text-shadow:12px 12px 0 var(--navy);white-space:nowrap;letter-spacing:-.02em}
#nameEn{left:62px;top:1262px;font-size:40px;font-weight:800;letter-spacing:.22em;color:var(--navy);white-space:nowrap}
#lt{left:56px;top:1330px;display:flex;filter:drop-shadow(0 18px 30px rgba(52,73,122,.32))}
#lt .tag{display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--navy);font-size:24px;height:88px;transform-origin:0 50%}
#lt .tag .dot{color:var(--tally);font-size:22px}
#lt .main{display:flex;align-items:center;gap:22px;padding:0 28px;background:#fff;color:var(--navy);height:88px}
#lt .main b{font-size:46px;font-weight:900;white-space:nowrap}
#lt .rwin{height:88px;overflow:hidden;border-left:4px solid var(--pink);padding-left:22px;width:420px}
#lt .roles{display:flex;flex-direction:column}
#lt .role{height:88px;display:flex;align-items:center;font-size:34px;font-weight:700;white-space:nowrap}
#vf{left:36px;right:36px;top:172px;bottom:400px}
#vf .c{position:absolute;width:74px;height:74px;border:6px solid #fff}
#vf .tl{top:0;left:0;border-right:0;border-bottom:0}#vf .tr{top:0;right:0;border-left:0;border-bottom:0}
#vf .bl{bottom:0;left:0;border-right:0;border-top:0}#vf .br{bottom:0;right:0;border-left:0;border-top:0}
#vf .rec{left:30px;top:28px;display:flex;align-items:center;gap:14px;font-size:28px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
#vf .rec .dot{color:var(--tally);font-size:36px}
#vf .spec{right:30px;top:32px;font-size:22px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
#vf .meter{left:30px;top:80px;display:grid;gap:7px}
#vf .meter i{display:block;width:240px;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--ok) 0 62%,var(--butter) 62% 84%,var(--tally) 84%);transform-origin:0 50%}
#vf .cross{left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px}
#vf .cross::before,#vf .cross::after{content:"";position:absolute;background:rgba(255,255,255,.8)}
#vf .cross::before{left:0;right:0;top:50%;height:3px;margin-top:-1.5px}
#vf .cross::after{top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px}
.afbox{left:0;top:0;width:200px;height:200px;color:#fff;visibility:hidden}
.afbox .k{position:absolute;width:36px;height:36px;border:5px solid currentColor}
.afbox .k1{left:0;top:0;border-right:0;border-bottom:0}.afbox .k2{right:0;top:0;border-left:0;border-bottom:0}
.afbox .k3{left:0;bottom:0;border-right:0;border-top:0}.afbox .k4{right:0;bottom:0;border-left:0;border-top:0}
.afbox b{position:absolute;left:0;top:calc(100% + 12px);font-size:24px;letter-spacing:.16em;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.35)}

/* ── statics ── */
.static{background:#111}
.static .noise{left:0;top:0;width:1080px;height:1920px;image-rendering:pixelated}
.static .lines{inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 3px,transparent 3px 6px)}
.static .osd{right:64px;top:236px;text-align:right;color:#fff;text-shadow:6px 6px 0 #000,0 0 26px rgba(0,0,0,.6)}
.static .osd b{display:block;font-size:150px;font-weight:800;line-height:1;letter-spacing:.02em}
.static .osd small{display:block;margin-top:14px;font-size:44px}

/* ── 3 · sports ── */
#sportsT{background:var(--dev)}
#sportsTIn{position:absolute;inset:0;transform-origin:540px 860px}
#sportsT .stripes{left:-700px;top:0;width:2600px;height:1920px;background:repeating-linear-gradient(-60deg,rgba(255,255,255,.04) 0 46px,transparent 46px 120px)}
#sportsT .bignum{right:-50px;top:110px;font-size:820px;font-weight:900;line-height:.8;color:transparent;-webkit-text-stroke:4px rgba(254,138,173,.2);letter-spacing:-.06em}
.chipRow{left:0;right:0;top:500px;display:flex;justify-content:center}
.chip{padding:16px 26px;border-radius:999px;border:3px solid currentColor;font-size:26px;display:flex;align-items:center;gap:14px;white-space:nowrap}
.chip .dot{color:var(--tally);font-size:24px}
.ttl{left:0;right:0;top:600px;display:grid;justify-items:center;font-weight:900;line-height:.88;letter-spacing:-.05em}
.ttl .ln{width:max-content;white-space:nowrap}
#sportsT .ttl .alt{color:var(--pink)}
.tsub{left:70px;right:70px;top:1010px;text-align:center;font-size:58px;font-weight:800;line-height:1.34;letter-spacing:-.02em}
.tsub .sl{overflow:hidden;padding:0 .1em}
.tsub .sl>span{display:inline-block}
#sportsT .tsub mark{background:linear-gradient(var(--butter),var(--butter)) no-repeat 0 90%/var(--hl,0%) 28%;color:inherit;padding:0 .06em}
#sportsT .tmeta{left:0;right:0;top:1214px;text-align:center;font-size:26px;color:#9AA4C0}
#sportsM{background:var(--dev)}
#checker{left:-720px;top:-500px;width:2520px;height:2920px;background:repeating-conic-gradient(#18224A 0 25%,#0B1020 0 50%) 0 0/128px 128px}
.card{border-radius:24px;overflow:hidden;background:#000;box-shadow:0 50px 90px -30px rgba(0,0,0,.85),0 0 0 7px #fff}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.cap{position:absolute;left:20px;bottom:20px;display:flex;align-items:center;gap:12px;padding:12px 18px;border-radius:999px;background:rgba(11,16,32,.88);font-size:27px;white-space:nowrap}
.cap b{font-weight:800}
.cap span{font-size:20px;color:var(--butter)}
#c1{left:50px;top:210px;width:980px;height:735px}
#c2{left:30px;top:690px;width:600px;height:400px}
#c3{left:670px;top:640px;width:360px;height:540px}
#c3 img{object-position:50% 30%}
#c4{left:40px;top:250px;width:560px;height:373px;display:none}
#c4 img{object-position:50% 45%}
#counter{left:56px;right:56px;top:1214px;padding:30px 36px;border-radius:28px;background:rgba(11,16,32,.96);border:2px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:26px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.odo{display:flex;align-items:baseline;font-weight:800;line-height:1;color:var(--butter);text-shadow:0 0 40px rgba(255,214,102,.45);letter-spacing:-.02em;flex:none}
#counter .odo{font-size:138px}
.odo .col{display:inline-block;height:1em;overflow:hidden}
.odo .strip{display:flex;flex-direction:column}
.odo .strip span{height:1em;line-height:1;text-align:center}
#counter .unit{font-size:52px;margin-left:8px}
#counter .cl p{font-size:33px;font-weight:800;line-height:1.25}
#counter .cl small{display:block;margin-top:10px;font-size:21px;line-height:1.35;color:#9AA4C0;font-weight:600}
#ticker{left:0;right:0;top:1446px;height:70px;display:flex;align-items:center;background:var(--tally);overflow:hidden}
#ticker .lab{flex:none;height:100%;display:flex;align-items:center;padding:0 24px;background:#fff;color:var(--tally);font-size:26px;position:relative;z-index:1}
#ticker .trk{display:flex;gap:36px;padding-left:36px;white-space:nowrap;font-size:30px;font-weight:800}
#ticker .trk b{color:rgba(255,255,255,.6);font-weight:800}

/* ── 4 · live commerce ── */
#liveT{background:linear-gradient(165deg,#FFE3EC 0%,#FFD0DF 42%,#CFE6F8 100%);color:var(--ink)}
#bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.8),rgba(255,255,255,0) 70%)}
#liveT .chip{color:var(--ink)}
#liveT .ttl .ln:first-child{color:var(--tally)}
#liveT .ttl .alt{color:var(--navy)}
#liveT .tsub{top:1050px}
#liveT .tsub mark{background:linear-gradient(var(--pink),var(--pink)) no-repeat 0 90%/var(--hl,0%) 30%;color:inherit;padding:0 .06em}
#liveW{background:#070A14}
#wall{left:60px;top:168px;width:960px;height:1668px;transform-origin:0 0}
.tile{position:absolute;width:228px;height:405px;border-radius:10px;background:#151B2E}
.tile .scr{position:absolute;inset:0;border-radius:10px;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .lbl{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:5px 8px;border-radius:4px;background:rgba(0,0,0,.62);font-size:15px;font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tl{position:absolute;inset:-8px;border-radius:15px;border:6px solid transparent}
.tile .tg{position:absolute;right:8px;top:8px;padding:4px 8px;border-radius:4px;font-size:15px;font-weight:800;letter-spacing:.1em;display:none}
.tile.pvw .tl{border-color:var(--ok)}
.tile.pgm .tl{border-color:var(--tally);box-shadow:0 0 40px rgba(255,45,75,.6)}
.tile.pvw .tg{display:block;background:var(--ok);color:#052012}
.tile.pgm .tg{display:block;background:var(--tally)}
.tile.pvw .tg::after{content:"PVW"}
.tile.pgm .tg::after{content:"PGM"}
#zoomUi{inset:0}
#zoomUi .badge{left:56px;top:204px;display:flex;gap:10px}
#zoomUi .badge span{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:8px;background:rgba(0,0,0,.6);font-size:28px}
#zoomUi .badge .rp{background:var(--tally)}
#zoomUi .brand{left:56px;right:170px;top:1190px;padding:26px 30px;border-radius:22px;background:rgba(255,255,255,.96);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
#zoomUi .brand b{display:block;font-size:50px;font-weight:900;letter-spacing:-.02em}
#zoomUi .brand span{display:block;margin-top:6px;font-size:28px;font-weight:600;color:#4B566F}
.hrt{position:absolute;left:0;top:0;width:64px;height:58px;visibility:hidden}

/* ── 5 · prompter ── */
#prompt{background:#05070E}
#prompt .glare{inset:0;background:linear-gradient(115deg,rgba(255,255,255,.06) 0 20%,transparent 20% 42%,rgba(255,255,255,.035) 42% 46%,transparent 46%)}
#prompt .top{left:64px;right:64px;top:204px;display:flex;justify-content:space-between;align-items:center;font-size:26px;color:#8A94AE}
#prompt .top span{display:flex;align-items:center;gap:12px}
#prompt .top .dot{color:var(--tally)}
#plines{left:100px;right:40px;top:0}
.pl{height:200px;display:flex;align-items:center;font-size:126px;font-weight:900;letter-spacing:-.04em;color:#3A4155;white-space:nowrap;transform-origin:0 50%}
.pl mark{background:linear-gradient(var(--butter),var(--butter)) no-repeat 0 88%/var(--hl,0%) 26%;color:inherit;padding:0 .04em}
#prompt .cue{top:960px;width:0;height:0;margin-top:-26px;border-top:26px solid transparent;border-bottom:26px solid transparent}
#prompt .cue.l{left:30px;border-left:38px solid var(--tally)}
#prompt .cue.r{right:30px;border-right:38px solid var(--tally)}
#prompt .motto{left:0;right:0;top:1330px;text-align:center;font-size:56px;font-weight:300;color:var(--pink)}
#prompt .pbar{left:64px;right:64px;top:1446px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
#prompt .pbar i{display:block;height:100%;width:100%;background:var(--tally);transform-origin:0 50%}

/* ── 6 · end card ── */
#shutter i{position:absolute;left:0;width:1080px;height:192px;background:var(--pink)}
#endBg{inset:0;background:radial-gradient(70% 45% at 70% 12%,var(--pinkhi),transparent 70%),radial-gradient(90% 60% at 0% 100%,var(--pink2),transparent 62%),var(--pink);opacity:0}
#passWrap{left:150px;top:60px;width:780px;height:1000px;transform-origin:390px -600px}
#lanyard{left:361px;top:-640px;width:58px;height:968px;background:var(--navy);overflow:hidden;display:grid;place-items:end center;padding-bottom:40px}
#lanyard span{writing-mode:vertical-rl;font-size:20px;letter-spacing:.3em;white-space:nowrap;color:#fff}
#clip{left:336px;top:300px;width:108px;height:48px;border-radius:12px;background:#C9CED9;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
#pass{left:0;top:330px;width:780px;border-radius:40px;background:#F9FAFC;color:var(--ink);overflow:hidden;box-shadow:0 60px 110px -40px rgba(52,73,122,.65)}
#pass .hd{display:flex;justify-content:space-between;align-items:center;padding:60px 44px 30px;background:var(--navy);color:#fff}
#pass .slot{position:absolute;left:50%;top:20px;width:112px;height:22px;margin-left:-56px;border-radius:11px;background:var(--pink)}
#pass .hd b{font-size:54px;font-weight:900}
#pass .hd span{font-size:22px;padding:8px 14px;border:2px solid rgba(255,255,255,.6);border-radius:999px}
#pass .bd{display:grid;grid-template-columns:250px 1fr;gap:36px;padding:42px 44px 30px}
#pass .ph{width:250px;height:314px;border-radius:18px;overflow:hidden;background:#ddd}
#pass .ph img{width:100%;height:100%;object-fit:cover;display:block}
#pass h3{font-size:100px;font-weight:900;letter-spacing:-.04em;line-height:1}
#pass .en{margin:14px 0 18px;font-size:26px;color:#4B566F}
#pass .roles{font-size:32px;font-weight:700;line-height:1.5}
#pass .code{margin:6px 44px 40px;height:90px;background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 8px,var(--ink) 8px 10px,transparent 10px 16px,var(--ink) 16px 22px,transparent 22px 24px,var(--ink) 24px 26px,transparent 26px 34px)}
#pass .shine{position:absolute;top:-30%;bottom:-30%;left:0;width:240px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent)}

.spk{position:absolute;left:0;top:0;width:70px;height:70px;color:#fff;visibility:hidden;filter:drop-shadow(0 0 12px rgba(255,255,255,.9))}

/* ── race day ── */
#race{background:var(--dev)}
#race .grid{inset:0;background:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.6px) 0 0/40px 40px}
#race .contour{left:-400px;top:-200px;width:1900px;height:2300px;background:repeating-radial-gradient(circle at 60% 45%,rgba(254,138,173,.07) 0 3px,transparent 3px 96px)}
#race .chipRow{top:196px}
#race .km{left:0;right:0;top:282px;display:flex;justify-content:center;align-items:baseline;gap:20px;color:var(--butter)}
#race .km b{font-size:168px;font-weight:800;line-height:1;letter-spacing:-.02em;text-shadow:0 0 40px rgba(255,214,102,.45)}

      const face = { x: fr.left - rr.left + fr.width * FACE.cx, y: fr.top - rr.top + fr.height * FACE.cy, w: fr.width * FACE.w * 1.34, h: fr.height * FACE.h * 1.16 };
      const p0 = { x: 560, y: 900, w: 300, h: 300 }, q = ease.o3(prog(lt, 0.55, 0.76));
      const box = { x: lerp(p0.x, face.x, q), y: lerp(p0.y, face.y, q), w: lerp(p0.w, face.w, q), h: lerp(p0.h, face.h, q) };
      let pop = 1; for (const j of [0.36, 0.8]) if (lt >= j && lt < j + 0.1) pop = 1 + 0.16 * (1 - (lt - j) / 0.1);
      af.style.visibility = lt >= 0.36 ? "visible" : "hidden";
      const w = box.w * pop, h = box.h * pop, lock = lt >= 0.8;
      af.style.width = w.toFixed(1) + "px"; af.style.height = h.toFixed(1) + "px";
      af.style.transform = `translate(${(box.x - w / 2).toFixed(1)}px,${(box.y - h / 2).toFixed(1)}px)`;
      af.style.color = lock ? "#1FA463" : "#34497A"; lbl.textContent = lock ? "AF · FACE" : "AF";
      const [x, y] = exitXY(s, lt); root.style.transform = `translate(${x.toFixed(1)}px,${(y + holdY(lt)).toFixed(1)}px)`;
    } };
};

// ── WORKED WITH: brand rows run across the frame
MODS.brands = (s) => {
  const root = mount("brands", 1, "brands");
  const d = s.d, rows = $$(".row", root);
  const fill = (el, list) => (el.innerHTML = list.concat(list).map((b) => `<span>${esc(b)}</span><i></i>`).join(""));
  fill(rows[0], D.brandsA); fill(rows[1], D.brandsB); fill(rows[2], D.brandsA.slice(8).concat(D.brandsA.slice(0, 8))); fill(rows[3], D.brandsB.slice(8).concat(D.brandsB.slice(0, 8)));
  $(".foot", root).textContent = D.brandsFoot;
  const SP = [[-1, 330, -120], [1, 280, -1800], [-1, 380, -600], [1, 300, -2400]];
  return { root, win: [0, d],
    build() {
      const tl = TL();
      G.set("#brands .hdr", { opacity: 0, y: -20 }); tl.to("#brands .hdr", { opacity: 1, y: 0, duration: 0.3 }, 0.12);
      G.set("#brands .foot", { opacity: 0, y: 20 }); tl.to("#brands .foot", { opacity: 1, y: 0, duration: 0.3 }, 0.4);
      return { tl, ev: { blur: exitBlur(s), cues: { whoosh: exitWhoosh(s) } } };
    },
    update(lt) {
      rows.forEach((el, i) => { const [dir, sp, x0] = SP[i], intro = (1 - ease.o3(prog(lt, 0.05 + i * 0.06, 0.55 + i * 0.06))) * 900 * (i % 2 ? -1 : 1);
        el.style.transform = `translateX(${(x0 + dir * sp * lt + intro).toFixed(1)}px)`; });
      const [x, y] = exitXY(s, lt); root.style.transform = `translate(${x.toFixed(1)}px,${(y + enterY(s, lt)).toFixed(1)}px)`;
    } };
};

// ── VOD: her YouTube clips, one plays at a time
MODS.vod = (s) => {
  const root = mount("vod", 1, "vod");
  const d = s.d, V = D.yt.slice(0, 6);
  $(".grid", root).innerHTML = V.map((v) => `<div class="vt"><img src="${v.src}" alt=""><div class="sh"></div><div class="pl"></div><div class="du">${esc(v.dur)}</div><div class="tt">${esc(v.title)}</div><div class="pr"></div></div>`).join("");
  const tiles = $$(".vt", root), ft = tiles.map((_, i) => 0.14 + i * 0.07), h0 = 0.75, hs = (d - 0.45 - h0) / V.length;
  return { root, win: [0, d],
    build() {
      const tl = TL();
      G.set("#vod .hdr", { opacity: 0, y: -20 }); tl.to("#vod .hdr", { opacity: 1, y: 0, duration: 0.3 }, 0.08);
      tiles.forEach((el, i) => { G.set(el, { rotationX: 70, opacity: 0, y: 60 }); tl.to(el, { rotationX: 0, opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, ft[i]); });
      G.set("#vod .foot", { opacity: 0, y: 20 }); tl.to("#vod .foot", { opacity: 1, y: 0, duration: 0.3 }, 0.6);
      return { tl, ev: { blur: exitBlur(s), cues: { flips: ft.map((x) => +x.toFixed(3)), vodblip: V.map((_, i) => +(h0 + i * hs).toFixed(3)), whoosh: exitWhoosh(s) } } };
    },
    update(lt) {
      const k = Math.floor((lt - h0) / hs);
      tiles.forEach((el, i) => { const on = i === k; el.classList.toggle("on", on);
        $(".pr", el).style.transform = `scaleX(${on ? prog(lt, h0 + i * hs, h0 + (i + 1) * hs).toFixed(3) : i < k ? 1 : 0})`; });
      const [x, y] = exitXY(s, lt); root.style.transform = `translate(${x.toFixed(1)}px,${(y + enterY(s, lt)).toFixed(1)}px)`;
    } };
};

// ───────── engine ─────────
const S = SCN.map((s) => Object.assign(MODS[s.mod](s), { s }));
const EV = { flash: [], shake: [], blur: [], glitch: [], cues: {} };
const addCue = (k, v) => (EV.cues[k] = EV.cues[k] || []).push(v);
const screen = $("#screen"), flash = $("#flash"), hud = $("#hud"), tally = $("#tally");

function globals(t) {
  hud.style.visibility = t >= SLAM ? "visible" : "hidden";
  const off = t >= OFF_T; tally.classList.toggle("off", off);
  $("#tallyTxt").textContent = off ? "Off Air" : "On Air";
  $("#tallyDot").style.opacity = off ? 0.5 : ((t - SLAM) % 0.5 + 0.5) % 0.5 < 0.3 ? 1 : 0.25;
  $("#hudTc").textContent = tc(3600 + Math.max(0, t - SLAM));
  let dx = 0, dy = 0;
  for (const [t0, d, a] of EV.shake) { const u = (t - t0) / d; if (u >= 0 && u < 1) { const m = a * (1 - u) * (1 - u); dx += m * Math.sin((t - t0) * 2 * Math.PI * 31 + t0); dy += m * Math.cos((t - t0) * 2 * Math.PI * 27 + t0 * 2); } }
  const sy = 1 - 0.994 * ease.i3(prog(t, CRT_T, CRT_T + 0.14)), sx = 1 - 0.996 * ease.i3(prog(t, CRT_T + 0.14, CRT_T + 0.24)), br = 1 + 2.4 * prog(t, CRT_T - 0.02, CRT_T + 0.14);
  screen.style.transform = `translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  screen.style.filter = br > 1.001 ? `brightness(${br.toFixed(3)})` : "none";
  screen.style.opacity = (1 - prog(t, CRT_T + 0.24, CRT_T + 0.32)).toFixed(3);
  const dk = prog(t, CRT_T + 0.26, CRT_T + 0.5); $("#dot").style.opacity = t >= CRT_T + 0.22 ? (1 - dk).toFixed(3) : 0;
  $("#dot").style.transform = `scale(${(1 - 0.7 * dk).toFixed(3)})`;
  let fl = t < SLAM ? 0.85 * ease.i2(prog(t, SLAM - 0.1, SLAM)) : 0;
  for (const [t0, a, d] of EV.flash) if (t >= t0) fl = Math.max(fl, a * Math.exp(-(t - t0) / d));
  flash.style.opacity = fl.toFixed(3);
  drawGrain(frameOf(t));
}

window.renderAt = (t) => {
  for (const m of S) {
    const lt = t - m.s.t0, on = lt >= m.win[0] && lt < m.win[1];
    m.root.style.display = on ? "block" : "none";
    if (on) { if (m.tl) m.tl.seek(Math.max(0, lt)); m.update(lt, t); }
  }
  globals(t);
};

(async () => {
  await document.fonts.ready;
  for (const m of S) { m.root.style.display = "block"; m.root.style.visibility = "hidden"; }
  await Promise.all($$("img").map((i) => i.decode().catch(() => null)));
  for (const el of $$(".fit")) { el.style.fontSize = "100px"; el.style.fontSize = ((100 * +el.dataset.w) / el.getBoundingClientRect().width).toFixed(2) + "px"; }
  for (const m of S) {
    const { tl, ev } = m.build(); m.tl = tl; const t0 = m.s.t0;
    for (const [a, ...r] of ev.flash || []) EV.flash.push([t0 + a, ...r]);
    for (const [a, ...r] of ev.shake || []) EV.shake.push([t0 + a, ...r]);
    for (const [a, b, ...r] of ev.blur || []) EV.blur.push([t0 + a, t0 + b, ...r]);
    for (const [a, b, ...r] of ev.glitch || []) EV.glitch.push([t0 + a, t0 + b, ...r]);
    for (const [k, list] of Object.entries(ev.cues || {})) for (const v of list) addCue(k, Array.isArray(v) ? [t0 + v[0], t0 + v[1], ...v.slice(2)] : +(t0 + v).toFixed(4));
  }
  for (const m of S) { m.root.style.display = "none"; m.root.style.visibility = ""; }
  // music sections: the bed drops out for every channel change and resolves on the end card
  const STY = { hero: "A", sports: "B", race: "B", tv: "B", stage: "B", pit: "B", cam2: "B", score: "B", vod: "B", live: "C", brands: "C", prompter: "D", end: "E" };
  const sections = [];
  SCN.forEach((s, i) => {
    const st = STY[s.mod]; if (!st) return;
    const prev = SCN[i - 1], next = SCN[i + 1];
    let a = s.mod === "hero" ? s.t0 + 0.18 : prev && prev.mod === "channel" ? s.t0 + 0.1 : s.t0 + 0.2;
    let b = !next ? DUR : next.mod === "channel" ? next.t0 + 0.12 : next.t0 + 0.2;
    sections.push([+a.toFixed(4), +b.toFixed(4), st]);
  });
  window.SHORTS = { fps: FPS, duration: DUR, width: 1080, height: 1920, blur: EV.blur, glitch: EV.glitch,
    cues: Object.assign({ bpm: 120, grid0: SLAM, length: DUR, sections }, EV.cues) };
  window.renderAt(0);
  window.SHORTS_READY = true;
})();
})();
</script>
</body>
</html>
